name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regrouper les fichiers JS (bundling) pour réduire les requêtes réseau
        run: npx --yes esbuild@0.24.2 public/js/app-main.js --bundle --format=esm --minify --outfile=public/js/dist/app.bundle.js --external:https://www.gstatic.com/*
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SERVICE_MAINTENANCE_ET_MENAGE }}
          projectId: service-maintenance-et-menage
