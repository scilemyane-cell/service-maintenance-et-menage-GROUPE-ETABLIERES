# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regrouper les fichiers JS (bundling) — découpé par module, chargé à la demande
        run: npx --yes esbuild@0.24.2 public/js/app-main.js --bundle --splitting --format=esm --minify --outdir=public/js/dist --entry-names=app.bundle --chunk-names=chunk-[hash] --external:https://www.gstatic.com/*
      - name: Forcer le rechargement de la nouvelle version (numéro de version dans les liens)
        run: |
          V="${GITHUB_RUN_NUMBER}"
          python3 -c "import json,subprocess,datetime;print(json.dumps({'version':'$V','date':datetime.datetime.now(datetime.timezone.utc).isoformat(),'commit':'${GITHUB_SHA::7}','message':subprocess.check_output(['git','log','-1','--format=%s']).decode().strip()},ensure_ascii=False))" > public/version.json
          cat public/version.json
          sed -i "s#js/dist/app.bundle.js\"#js/dist/app.bundle.js?v=$V\"#; s#css/style.css\"#css/style.css?v=$V\"#" public/app.html
          sed -i "s#css/style.css\"#css/style.css?v=$V\"#" public/index.html
          grep -n "?v=" public/app.html public/index.html
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SERVICE_MAINTENANCE_ET_MENAGE }}
          channelId: live
          projectId: service-maintenance-et-menage
      - name: Publier les règles Firestore
        continue-on-error: true
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SERVICE_MAINTENANCE_ET_MENAGE }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules --project service-maintenance-et-menage --non-interactive
