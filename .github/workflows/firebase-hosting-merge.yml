# Déploiement Firebase Hosting — DEUX versions en ligne, mêmes données :
#   • branche « stable » → adresse normale (tout le monde)      /app.html
#   • branche « main »   → version de TEST (Super Admin)         /beta/app.html
# Une nouveauté est d'abord publiée sur main (test). Elle n'arrive chez les
# autres utilisateurs qu'une fois validée : main est alors recopiée sur stable.
# Numéro de version = nombre de commits : le même code porte le même numéro
# en test et en validé (« valider la version 600 » = passer 600 en stable).

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
      - stable
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: test-src
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: stable
          path: stable-src
          fetch-depth: 0
      - name: Construire les deux versions
        run: |
          set -e
          construire() {
            dir="$1"; canal="$2"
            cd "$GITHUB_WORKSPACE/$dir"
            npx --yes esbuild@0.24.2 public/js/app-main.js --bundle --splitting --format=esm --minify --outdir=public/js/dist --entry-names=app.bundle --chunk-names=chunk-[hash] --external:https://www.gstatic.com/*
            V="$(git rev-list --count HEAD)"
            python3 -c "import json,subprocess,datetime;print(json.dumps({'version':'$V','canal':'$canal','date':subprocess.check_output(['git','log','-1','--format=%cI']).decode().strip(),'commit':subprocess.check_output(['git','rev-parse','--short','HEAD']).decode().strip(),'message':subprocess.check_output(['git','log','-1','--format=%s']).decode().strip()},ensure_ascii=False))" > public/version.json
            cat public/version.json
            sed -i "s#js/dist/app.bundle.js\"#js/dist/app.bundle.js?v=$V\"#; s#css/style.css\"#css/style.css?v=$V\"#" public/app.html
            sed -i "s#css/style.css\"#css/style.css?v=$V\"#" public/index.html
          }
          construire stable-src stable
          construire test-src test
          cd "$GITHUB_WORKSPACE"
          mkdir -p site/beta
          cp -r stable-src/public/. site/
          cp -r test-src/public/. site/beta/
          cat > firebase.json <<'JSON'
          {
            "hosting": {
              "public": "site",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "rewrites": [
                { "source": "/", "destination": "/index.html" },
                { "source": "/beta", "destination": "/beta/index.html" }
              ],
              "headers": [
                { "source": "**/*.@(html|css|js|json)", "headers": [ { "key": "Cache-Control", "value": "no-cache, max-age=0, must-revalidate" } ] },
                { "regex": "^(/beta)?/js/dist/chunk-[A-Za-z0-9]+\\.js$", "headers": [ { "key": "Cache-Control", "value": "public, max-age=31536000, immutable" } ] }
              ]
            }
          }
          JSON
          ls site | head; ls site/beta | head
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SERVICE_MAINTENANCE_ET_MENAGE }}
          channelId: live
          projectId: service-maintenance-et-menage
