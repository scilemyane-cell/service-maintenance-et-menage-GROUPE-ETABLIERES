<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Groupe Établières">
<meta property="og:title" content="Fiche du site – Groupe Établières">
<meta property="og:description" content="Fiche technique du site : équipements, emplacements, procédures, photos et numéros d'urgence. Sans compte ni mot de passe.">
<meta property="og:image" content="https://service-maintenance-et-menage.web.app/img/og-acces-prestataire.png">
<meta name="twitter:card" content="summary_large_image">
<title>Fiche PDF — Établières</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("etablieres-theme")||"sombre";}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
  html,body{ height:100%; }
  #pdf-frame{ position:fixed; inset:0; top:0; width:100%; height:100%; border:0; background:#525659; }
</style>
</head>
<body>
<div id="app">
  <div class="login-screen"><div class="hint">Chargement…</div></div>
</div>

<script type="module">
  import { getExistingPublicPdf } from "./js/pdf-public-share.js";

  const params = new URLSearchParams(location.search);
  const dossierId = params.get("dossier");
  const app = document.getElementById("app");

  function showError(msg) {
    app.innerHTML = `
      <div class="login-screen">
        <div class="login-card">
          <div class="login-eyebrow">Accès invalide</div>
          <h1>Impossible d'accéder</h1>
          <p class="hint">${msg}</p>
        </div>
      </div>`;
  }

  if (!dossierId) {
    showError("Ce lien ne contient pas de fiche valide. Scanne le QR code affiché sur le site.");
  } else {
    app.innerHTML = `<div class="login-screen"><div class="hint">Chargement du PDF…</div></div>`;
    try {
      const result = await getExistingPublicPdf(dossierId);
      if (!result) {
        showError("Ce PDF n'a pas encore été généré pour cette fiche. Contacte ton responsable.");
      } else {
        const url = URL.createObjectURL(result.blob);
        // Pages dessinées directement (PDF.js) : les téléphones Android n'affichent pas un PDF
        // dans la page (ils montrent seulement un nom de fichier + « Ouvrir »). Repli : iframe.
        let pagesOk = false;
        try {
          const pdfjs = await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs");
          pdfjs.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs";
          const pdf = await pdfjs.getDocument({ data: new Uint8Array(await result.blob.arrayBuffer()) }).promise;
          const zone = document.createElement("div");
          zone.style.cssText = "background:#525659;min-height:100vh;padding:64px 0 20px;display:flex;flex-direction:column;align-items:center;gap:12px";
          for (let n = 1; n <= pdf.numPages; n++) {
            const page = await pdf.getPage(n);
            const largeur = Math.min(window.innerWidth - 16, 900), base = page.getViewport({ scale: 1 });
            const vp = page.getViewport({ scale: (largeur / base.width) * Math.min(window.devicePixelRatio || 1, 2) });
            const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
            c.style.cssText = `width:${largeur}px;height:auto;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4)`;
            await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
            zone.appendChild(c);
            if (n === 1) { app.innerHTML = ""; app.appendChild(zone); }
          }
          pagesOk = true;
        } catch (e) { console.warn("Affichage des pages impossible, repli sur le lecteur PDF :", e); }
        if (!pagesOk) app.innerHTML = `<iframe id="pdf-frame" src="${url}"></iframe>`;
        app.insertAdjacentHTML("beforeend", ""
          // Venu de la liste « tous les sites » : bouton de retour + lien de téléchargement (le PDF
          // intégré ne s'affiche pas sur certains téléphones).
          + (params.get("liste") ? `<a href="sites-guest.html${params.get("liste") !== "1" ? "?a=" + encodeURIComponent(params.get("liste")) : ""}" style="position:fixed;left:10px;top:10px;z-index:5;background:#1f3a5f;color:#fff;padding:9px 13px;border-radius:10px;font:600 14px Segoe UI,Arial;text-decoration:none">← Tous les sites</a>` : "")
          + `<a href="${url}" download="${(result.nom || "fiche-site").replace(/[^\w\- ]+/g, "")}.pdf" style="position:fixed;right:10px;top:10px;z-index:5;background:#2e7d4f;color:#fff;padding:9px 13px;border-radius:10px;font:600 14px Segoe UI,Arial;text-decoration:none">⬇️ PDF</a>`);
      }
    } catch (e) {
      showError(`Erreur lors du chargement du PDF : ${e.message || e}`);
    }
  }
</script>
</body>
</html>
