<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Établières Astreinte — Connexion</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <div class="login-eyebrow">Groupe Établières</div>
      <h1>Établières <span style="color:var(--gold)">Astreinte</span></h1>
      <form id="login-form">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="username">
        <label>Mot de passe</label>
        <input type="password" id="password" required autocomplete="current-password">
        <button type="submit" class="login-btn" id="login-btn">Se connecter</button>
      </form>
      <div class="login-error" id="login-error"></div>
      <button type="button" id="forgot-link" style="background:none;border:none;color:var(--text-dim);font-size:12px;margin-top:14px;cursor:pointer;text-decoration:underline">Mot de passe oublié ?</button>

      <div id="forgot-box" style="display:none;margin-top:14px">
        <label>Email du compte</label>
        <input type="email" id="forgot-email" placeholder="ton-email@etablieres.fr">
        <button type="button" class="login-btn" id="forgot-send" style="margin-top:10px">Envoyer le lien de réinitialisation</button>
        <div id="forgot-status" style="font-size:12px;margin-top:10px"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { login, watchAuth } from "./js/auth.js";
    import { auth } from "./js/firebase-init.js";
    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    watchAuth((user) => { if (user) window.location.href = "app.html"; });

    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("login-error");
    const btn = document.getElementById("login-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Connexion…";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        await login(email, password);
        window.location.href = "app.html";
      } catch (err) {
        errorBox.textContent = "Connexion impossible : vérifie ton email et ton mot de passe.";
        errorBox.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Se connecter";
      }
    });

    const forgotLink = document.getElementById("forgot-link");
    const forgotBox = document.getElementById("forgot-box");
    const forgotEmail = document.getElementById("forgot-email");
    const forgotSend = document.getElementById("forgot-send");
    const forgotStatus = document.getElementById("forgot-status");

    forgotLink.addEventListener("click", () => {
      forgotBox.style.display = forgotBox.style.display === "none" ? "block" : "none";
      if (forgotBox.style.display === "block") {
        forgotEmail.value = document.getElementById("email").value.trim();
        forgotEmail.focus();
      }
    });

    forgotSend.addEventListener("click", async () => {
      const email = forgotEmail.value.trim();
      if (!email) { forgotStatus.innerHTML = `<span style="color:var(--red)">Indique ton email.</span>`; return; }
      forgotSend.disabled = true;
      forgotStatus.innerHTML = `<span style="color:var(--text-dim)">Envoi en cours…</span>`;
      try {
        await sendPasswordResetEmail(auth, email);
        forgotStatus.innerHTML = `<span style="color:var(--teal)">✓ Email envoyé si ce compte existe. Vérifie ta boîte de réception (et les spams).</span>`;
      } catch (err) {
        forgotStatus.innerHTML = `<span style="color:var(--teal)">✓ Email envoyé si ce compte existe. Vérifie ta boîte de réception (et les spams).</span>`;
      } finally {
        forgotSend.disabled = false;
      }
    });
  </script>
</body>
</html>
