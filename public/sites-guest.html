<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiches des sites — Groupe Établières</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Groupe Établières">
<meta property="og:title" content="Fiches des sites – Groupe Établières">
<meta property="og:description" content="Fiches techniques de nos sites : équipements, emplacements, procédures, photos et numéros d'urgence. Sans compte ni mot de passe.">
<meta property="og:image" content="https://service-maintenance-et-menage.web.app/img/og-acces-prestataire.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Roboto, Arial, sans-serif; background: #eef1f5; color: #1d2433; }
  header { background: #fff; border-bottom: 3px solid #c9a227; padding: 18px 16px 14px; text-align: center; }
  header img { height: 58px; }
  header .eti { font-size: 12px; letter-spacing: 2px; color: #c9a227; font-weight: 700; margin-top: 8px; }
  header h1 { margin: 4px 0 0; font-size: 22px; color: #1f3a5f; }
  main { max-width: 760px; margin: 0 auto; padding: 14px; }
  .rech { width: 100%; padding: 13px 14px; font-size: 16px; border-radius: 12px; border: 1px solid #cfd6e0; margin-bottom: 14px; }
  h2 { font-size: 14px; color: #1f3a5f; margin: 18px 4px 8px; text-transform: uppercase; letter-spacing: 1px; }
  .site { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid #dfe3e9; border-radius: 12px; padding: 13px 14px; margin-bottom: 8px; text-decoration: none; color: inherit; }
  .site:hover { border-color: #2e7d4f; }
  .site b { display: block; font-size: 16px; }
  .site small { color: #6b7280; }
  .site .go { margin-left: auto; background: #2e7d4f; color: #fff; border-radius: 8px; padding: 8px 12px; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .site.off { opacity: .55; }
  .site.off .go { background: #9aa3af; }
  .vide, .err { text-align: center; color: #6b7280; padding: 30px 10px; }
  .bienv { background:#fff; border:1px solid #dfe3e9; border-radius:16px; padding:22px 18px; max-width:440px; margin:10px auto; box-shadow:0 2px 8px rgba(0,0,0,.05); }
  .bienv h2 { text-transform:none; letter-spacing:0; font-size:22px; margin:0 0 6px; }
  .bienv p { color:#6b7280; margin:0 0 16px; font-size:14px; }
  .bienv label { display:block; font-size:13px; font-weight:600; color:#1f3a5f; margin-bottom:12px; }
  .bienv input { display:block; width:100%; margin-top:5px; padding:12px; font-size:16px; border:1px solid #cfd6e0; border-radius:10px; }
  .bienv button { width:100%; background:#2e7d4f; color:#fff; border:0; border-radius:12px; padding:14px; font-size:17px; font-weight:700; margin-top:6px; cursor:pointer; }
  .qui { text-align:center; color:#6b7280; font-size:14px; margin:0 0 12px; }
  .qui a { color:#1f3a5f; }
  footer { text-align: center; font-size: 12px; color: #6b7280; padding: 20px 10px 30px; }
</style>
</head>
<body>
<header>
  <img src="img/logo-etablieres.png" alt="Groupe Établières">
  <div class="eti">ACCÈS PRESTATAIRE</div>
  <h1>Fiches de nos sites</h1>
</header>
<main id="app"><p class="vide">Chargement…</p></main>
<footer>Groupe Établières · Service Maintenance et Entretien<br>Consultation seule — en cas de doute sur place, appelez le service maintenance.</footer>
<script type="module">
  import { lireIndexSites } from "./js/pdf-public-share.js";
  import { auth } from "./js/firebase-init.js";
  import { signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { getInvitation } from "./js/invitations-data.js";
  const app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  let sites = [], q = "";
  function rendre() {
    const l = sites.filter(s => !q || norm(`${s.nom} ${s.adresse} ${s.association} ${s.groupe}`).includes(norm(q)));
    const groupes = {};
    l.forEach(s => { (groupes[s.association || "Autres sites"] ||= []).push(s); });
    const blocs = Object.keys(groupes).sort((a, b) => a.localeCompare(b, "fr")).map(g => `<h2>${esc(g)}</h2>${groupes[g].sort((a, b) => a.nom.localeCompare(b.nom, "fr")).map(s => s.pdf
      ? `<a class="site" href="dossier-pdf-guest.html?dossier=${encodeURIComponent(s.id)}&liste=${encodeURIComponent(jeton || "1")}"><div><b>${esc(s.nom)}</b><small>${esc(s.adresse || "")}</small></div><span class="go">Ouvrir ›</span></a>`
      // Pas encore de PDF publié : fiche simplifiée (sans photos) en attendant.
      : `<a class="site" href="site-dossier-guest.html?dossier=${encodeURIComponent(s.id)}"><div><b>${esc(s.nom)}</b><small>${esc(s.adresse || "")}</small></div><span class="go">Ouvrir ›<br><small style="color:#d9f2e3;font-weight:500;font-size:11px">sans photos</small></span></a>`).join("")}`).join("");
    app.querySelector("#liste").innerHTML = blocs || `<p class="vide">Aucun site ne correspond à « ${esc(q)} ».</p>`;
  }
  // Accès daté (…?a=CODE, créé depuis Dossiers de site) : sites choisis, du … au ….
  const params = new URLSearchParams(location.search), jeton = params.get("a");
  const frJ = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long" });
  async function controleAcces() {
    if (!jeton) return { ok: true };
    const user = await new Promise((ok) => { const u = onAuthStateChanged(auth, async (x) => { if (x) { u(); ok(x); } else { try { await signInAnonymously(auth); } catch { u(); ok(null); } } }); });
    if (!user) return { ok: false, msg: "Connexion impossible. Réessayez plus tard." };
    const inv = await getInvitation(jeton);
    if (!inv || inv.type !== "sites") return { ok: false, msg: "Ce lien n'existe pas ou plus." };
    const apercu = params.get("apercu") === "1" && !user.isAnonymous;
    const d = new Date(), auj = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    if (!apercu && !inv.active) return { ok: false, msg: "Cet accès a été coupé. Contactez le Groupe Établières." };
    if (!apercu && inv.debut && auj < inv.debut) return { ok: false, msg: `Cet accès sera ouvert à partir du ${frJ(inv.debut)}.` };
    if (!apercu && inv.fin && auj > inv.fin) return { ok: false, msg: `Cet accès a expiré le ${frJ(inv.fin)}. Contactez le Groupe Établières pour un nouveau lien.` };
    return { ok: true, inv };
  }
  try {
    const acc = await controleAcces();
    if (!acc.ok) { app.innerHTML = `<p class="err">🔒 ${esc(acc.msg)}</p>`; throw null; }
    if (acc.inv) document.querySelector("header h1").insertAdjacentHTML("afterend", `<div style="margin-top:6px;color:#6b7280;font-size:14px">${esc(acc.inv.label || "")}${acc.inv.fin ? ` · accès jusqu'au <b>${frJ(acc.inv.fin)}</b>` : ""}</div>`);
    const idx = await lireIndexSites();
    // Noms sans adresse mail entre parenthèses ; dossier modèle « Nouvelle résidence » écarté.
    sites = (idx?.sites || []).map(s => ({ ...s, nom: String(s.nom || "").replace(/\(?\s*[\w.+-]+@[\w-]+(\.[\w-]+)+\s*\)?/g, "").replace(/\s{2,}/g, " ").trim() })).filter(s => s.nom && !/^nouvelle r[ée]sidence$/i.test(s.nom));
    if (acc.inv) { const ids = new Set((acc.inv.sites || []).map(x => x.id)); sites = sites.filter(s => ids.has(s.id)); }
    // 👋 Bienvenue : la personne s'identifie (mémorisé sur ce téléphone), comme pour les fiches MNA.
    const CLE = `smm-sites-id:${jeton || "public"}`;
    let ident = null; try { ident = JSON.parse(localStorage.getItem(CLE) || "null"); } catch {}
    if (!ident) {
      ident = await new Promise((ok) => {
        app.innerHTML = `<div class="bienv"><h2>👋 Bienvenue</h2><p>Avant de commencer, indiquez qui vous êtes. Ce téléphone s'en souviendra pour les prochaines fois.</p>
          <form id="f-id"><label>Prénom<input name="prenom" required autocomplete="given-name"></label><label>Nom<input name="nom" required autocomplete="family-name"></label>
          <label>Société<input name="societe" required autocomplete="organization" value="${esc(acc.inv?.label || "")}"></label><button>Commencer ✓</button></form></div>`;
        app.querySelector("#f-id").addEventListener("submit", (e) => { e.preventDefault(); const f = new FormData(e.target);
          const id = { prenom: String(f.get("prenom")).trim(), nom: String(f.get("nom")).trim(), societe: String(f.get("societe")).trim() };
          try { localStorage.setItem(CLE, JSON.stringify(id)); } catch {} ok(id); });
      });
    }
    const quiHTML = `<p class="qui">Bonjour <b>${esc(ident.prenom)}</b>${ident.societe ? ` (${esc(ident.societe)})` : ""} · <a href="#" id="pas-moi">ce n'est pas moi</a></p>`;
    if (!sites.length) { app.innerHTML = `<p class="err">La liste des sites n'est pas encore disponible. Contactez le service maintenance.</p>`; }
    else {
      app.innerHTML = `${quiHTML}<input class="rech" type="search" placeholder="🔍 Rechercher un site, une ville…" autocomplete="off"><div id="liste"></div>`;
      app.querySelector(".rech").addEventListener("input", (e) => { q = e.target.value; rendre(); });
      rendre();
    }
    app.querySelector("#pas-moi")?.addEventListener("click", (e) => { e.preventDefault(); try { localStorage.removeItem(CLE); } catch {} location.reload(); });
  } catch (e) { if (e) app.innerHTML = `<p class="err">Impossible de charger la liste : ${esc(e.message || e)}</p>`; }
</script>
</body>
</html>
