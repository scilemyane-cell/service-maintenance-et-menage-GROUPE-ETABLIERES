<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<base href="/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Groupe Établières">
<meta property="og:title" content="Accès prestataire – Groupe Établières">
<meta property="og:description" content="Votre accès personnel au service Maintenance et Entretien : fiches de traçabilité, mission de ménage. Sur téléphone, sans compte ni mot de passe.">
<meta property="og:image" content="https://service-maintenance-et-menage.web.app/img/og-acces-prestataire.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Votre accès personnel au service Maintenance et Entretien : fiches de traçabilité, mission de ménage. Sur téléphone, sans compte ni mot de passe.">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiches ménage — Établières</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("etablieres-theme")||"sombre";}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div class="login-screen"><div class="hint">Chargement…</div></div>
</div>

<script type="module">
  import { auth } from "./js/firebase-init.js";
  import { signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { getInvitation } from "./js/invitations-data.js";
  import { mountGuestFiche, sitesInvitation } from "./js/guest-fiche.js";

  const params = new URLSearchParams(location.search);
  // Lien court …/m/CODE (prestataire ménage) ou ancien lien guest.html?invite=CODE.
  const token = params.get("invite") || (location.pathname.match(/^\/m\/([A-Za-z0-9_-]+)/) || [])[1] || null;
  const app = document.getElementById("app");

  function showError(msg) {
    app.innerHTML = `
      <div class="login-screen">
        <div class="login-card">
          <div class="login-eyebrow">Accès invalide</div>
          <h1>Impossible d'accéder</h1>
          <p class="hint">${msg}</p>
        </div>
      </div>`;
  }

  if (!token) {
    showError("Ce lien ne contient pas de code d'accès valide. Demande un nouveau lien à ton contact.");
  } else {
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        try { await signInAnonymously(auth); } catch (e) { showError("Connexion impossible. Réessaie plus tard."); }
        return;
      }
      const invitation = await getInvitation(token);
      if (!invitation) { showError("Ce lien n'existe pas ou plus."); return; }
      // Aperçu par un responsable connecté (…&apercu=1) : pas de contrôle de dates ni d'accès coupé.
      const apercu = params.get("apercu") === "1" && !user.isAnonymous && invitation.type === "ponctuel";
      if (!apercu && !invitation.active) { showError("Cet accès a été coupé. Contacte le Groupe Établières."); return; }
      const d = new Date(), auj = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      const fr = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long" });
      // Avant la date de début : fiches de traçabilité consultables (voir ce qu'il y a à faire), sans cocher.
      const consultation = !apercu && invitation.debut && auj < invitation.debut;
      if (consultation && invitation.type === "ponctuel") { showError(`Cet accès sera ouvert à partir du ${fr(invitation.debut)}.`); return; }
      if (consultation) invitation.consultationJusqua = invitation.debut;
      if (!apercu && invitation.fin && auj > invitation.fin) { showError(`Cet accès a expiré le ${fr(invitation.fin)}. Contacte le Groupe Établières si tu as encore des fiches à remplir.`); return; }
      if (invitation.type === "ponctuel") {
        app.innerHTML = `
        <header class="topbar"><div class="topbar-title"><span class="topbar-eyebrow">Groupe Établières · Ménage ponctuel</span><h1>${(invitation.siteName || "").replace(/[<>&"]/g, "")}</h1></div>
          <div class="topbar-user"><span>${invitation.fin ? `Accès jusqu'au <b>${fr(invitation.fin)}</b>` : ""}</span></div></header>
        <main class="content" id="content"></main>`;
        const { mountGuestPonctuel } = await import("./js/guest-ponctuel.js");
        mountGuestPonctuel(document.getElementById("content"), user, invitation);
        return;
      }
      const noms = sitesInvitation(invitation).map(s => s.name).join(" · ");
      app.innerHTML = `
        <header class="topbar">
          <div class="topbar-title">
            <span class="topbar-eyebrow">Groupe Établières · Fiches de traçabilité ménage</span>
            <h1>${noms}</h1>
          </div>
          <div class="topbar-user"><span>${invitation.fin ? `Accès jusqu'au <b>${fr(invitation.fin)}</b>` : ""}</span></div>
        </header>
        <main class="content" id="content"></main>
      `;
      mountGuestFiche(document.getElementById("content"), user, invitation);
    });
  }
</script>
</body>
</html>
