<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiches ménage — Établières</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("etablieres-theme")||"sombre";}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div class="login-screen"><div class="hint">Chargement…</div></div>
</div>

<script type="module">
  import { auth } from "./js/firebase-init.js";
  import { signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { getInvitation } from "./js/invitations-data.js";
  import { mountGuestFiche, sitesInvitation } from "./js/guest-fiche.js";

  const params = new URLSearchParams(location.search);
  const token = params.get("invite");
  const app = document.getElementById("app");

  function showError(msg) {
    app.innerHTML = `
      <div class="login-screen">
        <div class="login-card">
          <div class="login-eyebrow">Accès invalide</div>
          <h1>Impossible d'accéder</h1>
          <p class="hint">${msg}</p>
        </div>
      </div>`;
  }

  if (!token) {
    showError("Ce lien ne contient pas de code d'accès valide. Demande un nouveau lien à ton contact.");
  } else {
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        try { await signInAnonymously(auth); } catch (e) { showError("Connexion impossible. Réessaie plus tard."); }
        return;
      }
      const invitation = await getInvitation(token);
      if (!invitation) { showError("Ce lien n'existe pas ou plus."); return; }
      if (!invitation.active) { showError("Cet accès a été coupé. Contacte le Groupe Établières."); return; }
      const d = new Date(), auj = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      const fr = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long" });
      if (invitation.debut && auj < invitation.debut) { showError(`Cet accès sera ouvert à partir du ${fr(invitation.debut)}.`); return; }
      if (invitation.fin && auj > invitation.fin) { showError(`Cet accès a expiré le ${fr(invitation.fin)}. Contacte le Groupe Établières si tu as encore des fiches à remplir.`); return; }
      const noms = sitesInvitation(invitation).map(s => s.name).join(" · ");
      app.innerHTML = `
        <header class="topbar">
          <div class="topbar-title">
            <span class="topbar-eyebrow">Groupe Établières · Fiches de traçabilité ménage</span>
            <h1>${noms}</h1>
          </div>
          <div class="topbar-user"><span>${invitation.fin ? `Accès jusqu'au <b>${fr(invitation.fin)}</b>` : ""}</span></div>
        </header>
        <main class="content" id="content"></main>
      `;
      mountGuestFiche(document.getElementById("content"), user, invitation);
    });
  }
</script>
</body>
</html>
