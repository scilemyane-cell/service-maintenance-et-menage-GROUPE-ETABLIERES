<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Établières</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("etablieres-theme")||"sombre";}catch(e){}</script>
<link rel="stylesheet" href="css/style.css">
<!-- "defer" sur ces 6 librairies : chacune n'est utilisée que par une
     fonctionnalité précise déclenchée plus tard (export PDF/Excel, QR,
     scan...), jamais au tout premier affichage. Sans "defer", le
     navigateur devait les télécharger et exécuter une par une AVANT même
     de pouvoir afficher "Chargement…", ce qui ajoutait une latence bien
     visible à chaque ouverture de l'appli. -->
<script defer src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.24.0/lib/msal-browser.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.9.2/lib/qr-code-styling.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script defer src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
<div id="app">
  <div class="login-screen"><div class="hint">Chargement…</div></div>
</div>

<!-- Ce fichier est regroupé (bundlé) à partir de public/js/app-main.js
     (source lisible/éditable) par le workflow de déploiement — voir
     .github/workflows/. En local (sans build), ce fichier n'existe pas ;
     lance `npx esbuild public/js/app-main.js --bundle --format=esm
     --outfile=public/js/dist/app.bundle.js --external:https://www.gstatic.com/*`
     pour le générer et tester. -->
<script type="module" src="js/dist/app.bundle.js"></script>
</body>
</html>
