<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novimmo Astreinte</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div class="login-screen"><div class="hint">Chargement…</div></div>
</div>

<script type="module">
  import { watchAuth, logout, roleLabel } from "./js/auth.js";
  import { mountCalendrier, mountAbsencesTab, mountInterventionsTab, mountSyntheseTab } from "./js/planning.js";
  import { mountHeures } from "./js/heures.js";
  import { mountAccueil } from "./js/home.js";

  let currentUser = null;
  let currentTab = "accueil";

  const TABS = [
    { id: "accueil",       label: "Accueil",         icon: "🏠", desc: "Vue d'ensemble",              roles: ["admin","n1","technicien","menage","mi_temps","direction"] },
    { id: "astreinte",     label: "Astreinte",        icon: "📅", desc: "Calendrier des gardes",       roles: ["admin","n1","technicien","menage","mi_temps","direction"] },
    { id: "absences",      label: "Absences",         icon: "👥", desc: "Congés et arrêts",            roles: ["admin","n1"] },
    { id: "interventions", label: "Interventions",    icon: "🔧", desc: "Journal des interventions",   roles: ["admin","n1","technicien"] },
    { id: "synthese",      label: "Synthèse",         icon: "📊", desc: "Statistiques d'interventions",roles: ["admin","n1","direction"] },
    { id: "heures",        label: "Heures",           icon: "🕒", desc: "Saisie et validation",        roles: ["admin","n1","direction","menage","mi_temps"] },
    { id: "sites",         label: "Dossiers de site", icon: "🏢", desc: "Bientôt disponible",          roles: ["admin","n1","technicien","menage","mi_temps","direction"], soon: true },
  ];

  watchAuth((user) => {
    if (!user) { window.location.href = "index.html"; return; }
    currentUser = user;
    render();
  });

  function visibleTabsFor(user) {
    return TABS.filter(t => t.roles.includes(user.role));
  }

  function render() {
    const app = document.getElementById("app");

    if (currentUser.role === null) {
      app.innerHTML = `
        <div class="login-screen">
          <div class="login-card">
            <div class="login-eyebrow">Compte non configuré</div>
            <h1>Presque prêt</h1>
            <p class="hint">Ton compte existe mais n'a pas encore de rôle attribué dans la base. Demande à l'administrateur de créer ton profil dans la collection <code>users</code> (voir README).</p>
            <button class="logout-btn" id="logout-btn" style="margin-top:16px">Se déconnecter</button>
          </div>
        </div>`;
      document.getElementById("logout-btn").addEventListener("click", () => logout());
      return;
    }

    const visibleTabs = visibleTabsFor(currentUser);
    if (!visibleTabs.some(t => t.id === currentTab)) currentTab = "accueil";

    app.innerHTML = `
      <header class="topbar">
        <div class="topbar-title">
          <span class="topbar-eyebrow">Groupe Établières · Maintenance</span>
          <h1>Novimmo <span class="accent">Astreinte</span></h1>
        </div>
        <div class="topbar-user">
          <span><b>${escapeHtml(currentUser.nom || currentUser.email)}</b> · ${escapeHtml(roleLabel(currentUser.role))}</span>
          <button class="logout-btn" id="logout-btn">Se déconnecter</button>
        </div>
      </header>
      <nav class="tabs">
        ${visibleTabs.map(t => `<button class="tab-btn ${t.id===currentTab?'active':''}" data-tab="${t.id}">${t.icon} ${t.label}</button>`).join("")}
      </nav>
      <main class="content" id="content"></main>
    `;

    document.getElementById("logout-btn").addEventListener("click", () => logout());
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => { currentTab = btn.dataset.tab; render(); });
    });

    renderTabContent();
  }

  function renderTabContent() {
    const content = document.getElementById("content");
    const tabDef = TABS.find(t => t.id === currentTab);

    if (currentTab === "accueil") {
      const tiles = visibleTabsFor(currentUser).filter(t => t.id !== "accueil");
      mountAccueil(content, currentUser, tiles, (tabId) => { currentTab = tabId; render(); });
      return;
    }
    if (currentTab === "astreinte") { mountCalendrier(content, currentUser); return; }
    if (currentTab === "absences") { mountAbsencesTab(content, currentUser); return; }
    if (currentTab === "interventions") { mountInterventionsTab(content, currentUser); return; }
    if (currentTab === "synthese") { mountSyntheseTab(content, currentUser); return; }
    if (currentTab === "heures") { mountHeures(content, currentUser); return; }

    content.innerHTML = `
      <div class="placeholder-card">
        <b>Bientôt disponible</b><br><br>
        Ce module (${escapeHtml(tabDef?.label || "")}) arrive dans une prochaine phase du projet.
      </div>`;
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
</script>
</body>
</html>
