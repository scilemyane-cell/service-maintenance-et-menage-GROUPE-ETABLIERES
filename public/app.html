<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Établières Astreinte</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div class="login-screen"><div class="hint">Chargement…</div></div>
</div>

<script type="module">
  import { watchAuth, logout, roleLabel } from "./js/auth.js";
  import { mountCalendrier, mountAbsencesTab, mountInterventionsTab, mountSyntheseTab } from "./js/planning.js";
  import { mountDashboard } from "./js/home.js";
  import { mountFichesForDispositif } from "./js/fiches.js";
  import { mountHeures } from "./js/heures.js";
  import { mountRepartitionForDispositif } from "./js/heures-repartition.js";
  import { mountArchiveForDispositif } from "./js/heures-archive.js";
  import { watchDispositifSettings, heuresEnabled } from "./js/dispositif-settings-data.js";
  import { mountTracabilite, mountTracabiliteForDispositif } from "./js/tracabilite.js";
  import { mountUtilisateurs, mountAccesRemplacants, mountParametresDispositif } from "./js/parametres.js";
  import { watchSites } from "./js/sites-data.js";
  import { watchAccess, hasAccess } from "./js/access-data.js";

  let currentUser = null;
  let currentCategory = null; // null = accueil (bulles)
  let currentSubtab = null;
  let dispositifsList = [];
  let accessMap = {};
  let dispositifSettings = {};
  let sitesSubscribed = false;

  const ALL = ["admin","n1","technicien","menage","mi_temps","direction"];
  const MENAGE_ROLES = ["admin","n1","direction","menage","mi_temps"];

  function dispositifCategories(user) {
    return dispositifsList
      .filter(d => hasAccess(accessMap, d, user))
      .map(d => ({
        id: "disp-" + d, label: d, icon: "🧹", desc: "Fiches, traçabilité",
        subtabs: [
          { id: "fiches",      label: "Fiches",      icon: "📋", roles: MENAGE_ROLES,       mount: (c, u) => mountFichesForDispositif(c, u, d) },
          ...(heuresEnabled(dispositifSettings, d) ? [
            { id: "heures", label: "Heures", icon: "🕒", roles: MENAGE_ROLES, mount: mountHeures },
            { id: "repartition", label: "Répartition", icon: "📊", roles: MENAGE_ROLES, mount: (c, u) => mountRepartitionForDispositif(c, u, d) },
            { id: "archive", label: "Archive", icon: "🗄️", roles: ["admin","n1","direction"], mount: (c, u) => mountArchiveForDispositif(c, u, d) },
          ] : []),
          { id: "tracabilite", label: "Traçabilité", icon: "🧾", roles: MENAGE_ROLES,       mount: (c, u) => mountTracabiliteForDispositif(c, u, d) },
          { id: "parametres",  label: "Paramètres",  icon: "⚙️", roles: ["admin","n1"],     mount: (c, u) => mountParametresDispositif(c, u, d) },
        ],
      }));
  }

  function staticCategories() {
    return [
      {
        id: "astreinte", label: "Astreinte", icon: "📅", desc: "Planning, absences, interventions",
        subtabs: [
          { id: "calendrier",     label: "Calendrier",     icon: "📅", roles: ALL,                         mount: mountCalendrier },
          { id: "absences",       label: "Absences",       icon: "👥", roles: ["admin","n1"],              mount: mountAbsencesTab },
          { id: "interventions",  label: "Interventions",  icon: "🔧", roles: ["admin","n1","technicien"], mount: mountInterventionsTab },
          { id: "synthese",       label: "Synthèse",       icon: "📊", roles: ["admin","n1","direction"],  mount: mountSyntheseTab },
        ],
      },
      {
        id: "administration", label: "Administration", icon: "🛠️", desc: "Comptes, accès remplaçants",
        subtabs: [
          { id: "utilisateurs", label: "Utilisateurs",       icon: "👤", roles: ["admin","n1"], mount: mountUtilisateurs },
          { id: "remplacants",  label: "Accès remplaçants",  icon: "🔗", roles: ["admin","n1"], mount: mountAccesRemplacants },
        ],
      },
      {
        id: "sites", label: "Dossiers de site", icon: "🏢", desc: "Bientôt disponible",
        subtabs: [
          { id: "liste", label: "Dossiers", icon: "🏢", roles: ALL, mount: null },
        ],
      },
    ];
  }

  function allCategories(user) {
    const [astreinte, administration, sites] = staticCategories();
    return [astreinte, ...dispositifCategories(user), administration, sites];
  }

  watchAuth((user) => {
    if (!user) { window.location.href = "index.html"; return; }
    currentUser = user;
    if (!sitesSubscribed) {
      sitesSubscribed = true;
      watchSites((sitesList) => {
        dispositifsList = [...new Set(sitesList.map(s => s.dispositif || "Dispositif MNA"))];
        render();
      });
      watchAccess((a) => { accessMap = a; render(); });
      watchDispositifSettings((s) => { dispositifSettings = s; render(); });
    }
    render();
  });

  function categorySubtabsFor(category, user) {
    return category.subtabs.filter(s => s.roles.includes(user.role));
  }
  function visibleCategoriesFor(user) {
    return allCategories(user).filter(c => categorySubtabsFor(c, user).length > 0);
  }

  function render() {
    const app = document.getElementById("app");

    if (currentUser.role === null) {
      app.innerHTML = `
        <div class="login-screen">
          <div class="login-card">
            <div class="login-eyebrow">Compte non configuré</div>
            <h1>Presque prêt</h1>
            <p class="hint">Ton compte existe mais n'a pas encore de rôle attribué dans la base. Demande à l'administrateur de créer ton profil dans la collection <code>users</code> (voir README).</p>
            <button class="logout-btn" id="logout-btn" style="margin-top:16px">Se déconnecter</button>
          </div>
        </div>`;
      document.getElementById("logout-btn").addEventListener("click", () => logout());
      return;
    }

    const cats = allCategories(currentUser);
    const category = cats.find(c => c.id === currentCategory) || null;

    app.innerHTML = `
      <header class="topbar">
        <div class="topbar-title">
          ${category ? `<button class="back-btn" id="back-home">← Accueil</button>` : ""}
          <span class="topbar-eyebrow">Groupe Établières · Service Maintenance et Ménage</span>
          <h1>Établières <span class="accent">Astreinte</span></h1>
        </div>
        <div class="topbar-user">
          <span><b>${escapeHtml(currentUser.nom || currentUser.email)}</b> · ${escapeHtml(roleLabel(currentUser.role))}</span>
          <button class="logout-btn" id="logout-btn">Se déconnecter</button>
        </div>
      </header>
      ${category ? `
      <nav class="tabs">
        ${categorySubtabsFor(category, currentUser).map(s => `<button class="tab-btn ${s.id===currentSubtab?'active':''}" data-subtab="${s.id}">${s.icon} ${s.label}</button>`).join("")}
      </nav>` : ""}
      <main class="content" id="content"></main>
    `;

    document.getElementById("logout-btn").addEventListener("click", () => logout());
    const backBtn = document.getElementById("back-home");
    if (backBtn) backBtn.addEventListener("click", () => { currentCategory = null; currentSubtab = null; render(); });

    document.querySelectorAll("[data-subtab]").forEach(btn => {
      btn.addEventListener("click", () => { currentSubtab = btn.dataset.subtab; render(); });
    });

    renderContent(category);
  }

  function renderContent(category) {
    const content = document.getElementById("content");

    if (!category) {
      const cats = visibleCategoriesFor(currentUser);
      mountDashboard(content, currentUser, cats, (catId) => {
        currentCategory = catId;
        const cat = allCategories(currentUser).find(c => c.id === catId);
        const subs = categorySubtabsFor(cat, currentUser);
        currentSubtab = subs[0]?.id || null;
        render();
      });
      return;
    }

    const subs = categorySubtabsFor(category, currentUser);
    if (!subs.some(s => s.id === currentSubtab)) currentSubtab = subs[0]?.id || null;
    const activeSub = subs.find(s => s.id === currentSubtab);

    if (activeSub && activeSub.mount) {
      activeSub.mount(content, currentUser);
      return;
    }

    content.innerHTML = `
      <div class="placeholder-card">
        <b>Bientôt disponible</b><br><br>
        Ce module (${escapeHtml(activeSub?.label || category.label)}) arrive dans une prochaine phase du projet.
      </div>`;
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
</script>
</body>
</html>
